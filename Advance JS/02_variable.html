<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables in JavaScript</title>
</head>
<body>

    <script>

        // 1) var : global

        var a = 10 //declearation
        var a = 12 //re declearation 
        a = 20 //assigement
        console.log("A :",a)

        // 2) let : local

        let b = 30 //declearation
        // let b = 34 // re declearation not allowed
        b =36 // re-assigment
        console.log("B :",b)

        // 3) const : unique 

        const x = 90 
        // const x = 98 re declearation not allowed
        // x = 97 re assigment not allowed
        console.log("X : ",x)

    </script>
    
</body>
</html>
