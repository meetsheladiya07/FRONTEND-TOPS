<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch data</title>

</head>
<body>
    
    <script>
        fetch('https://jsonplaceholder.typicode.com/posts',{
            method: 'GET'
        })
        .then((res)=>{
            return res.json()
        })
        .then((res)=>{
            // console.log(res)
            for(let data of res){
                console.log(data.)
            }
        })
    </script>
</html>
