<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch User Data</title>
</head>
<body>
    <script>

      fetch("test.json",{
        method:"GET"
      })
      .then((res)=>{
        return res.json()
      })
      .then((test)=>{
         console.log(test)
         document.write(`<h1>Users</h1>`)
        test.users.forEach((data)=>{
            document.write(`<p>${data.name}</p>`)
        })

        document.write(`<h1>Admins</h1>`)

        test.admins.forEach((data)=>{
            document.write(`<p>${data.name}</p>`)
        })
      })

    </script>
</body>
</html>
