<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bind Method</title>
</head>
<body>
    <script>
        let demo = {
            deatils : function test(){
                console.log("Name : ",this.fname," lname  : ",this.lname)
            }
        }

        let person = {
            fname : "Meet",
            lname : "Sheladiya"
        }

        // as object function store
        let test = demo.deatils.bind(person)

        test()
    </script>
</body>
</html>
