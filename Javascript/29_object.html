<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object</title>
</head>
<body>
    
    <!-- object : collection of multiple value store in single varibale {}
        {
            key : "value",
            key : "value"
        } 
    -->

    <script>

        let person = {
            name : "Meet",
            surname :"Sheladiya",
            course : "Full Stack Java",
            age : 21
        }

        console.log(person)

        console.log(person.course)
        console.log(person.age)

        // document.writeln(person)
        document.writeln(person.name)

    </script>

</body>
</html>
