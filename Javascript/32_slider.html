<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider</title>
    <style>
        .main{
            height: 600px;
            width: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>
    
    <div class="main">
        <img src="/img/img1.jpg" height="100%" class="img" width="100%" alt="">
        <img src="/img/img2.jpg" height="100%" class="img" width="100%" alt="">
        <img src="/img/img3.jpg" height="100%" class="img" width="100%" alt="">
        <img src="/img/img4.jpg" height="100%" class="img" width="100%" alt="">
        <img src="/img/img5.jpg" height="100%" class="img" width="100%" alt="">
    </div>
    <button onclick="slider()">Next</button>
    <button onclick="prevSlider()">Previous</button>


    <script>

        let img_tag = document.getElementsByClassName("img")
        console.log(img_tag)

        let index = 0

        function slider(){

            for(let i =0;i<img_tag.length;i++){
                // console.log(img_tag[i])
                img_tag[i].style.display = "none"
            }

            img_tag[index].style.display = "block"
            index ++
            
            if(index == 5){
                index = 0
            }
            // setTimeout(slider,1000)
        }
        // slider()

        function prevSlider(){

            for(let i =0;i<img_tag.length;i++){
                // console.log(img_tag[i])
                img_tag[i].style.display = "none"
            }

            img_tag[index].style.display = "block"
            index --
            
            if(index == -1){
                index = 4
            }
            // setTimeout(slider,1000)
        }

    </script>

</body>
</html>
