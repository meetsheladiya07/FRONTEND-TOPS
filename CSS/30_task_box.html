<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .main {
            background-image: url("/images/img1.jpg");
            background-size: 100% 100%;
            height: 400px;
            width: 800px;
            border: 2px solid;
            margin: 200px auto;
            overflow: hidden;
        }

        .right {
            height: 400px;
            width: 800px;
            background-color: rgba(0, 0, 0, .2);
            transform: translate(100%, -100%);
            transition: .7s;
        }

        .main:hover .right {
            transform: translate(0%, 0%);
        }

        .left {
            height: 400px;
            width: 800px;
            background-color: rgba(0, 0, 0, .2);
            transform: translate(-100%, 0%);
            transition: .7s;
        }

        .main:hover .left {
            transform: translate(0%, -100%);
        }
        .highlight {
            color: #00e5c0;            
            font-weight: 500;
        }

        .permanent-text {
            position: absolute;
            font-family: 'Montserrat', sans-serif;
            font-size: 42px;
            font-weight: 300;
            letter-spacing: 14px;
            color: white;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
    </style>
</head>

<body>
    <div class="main">
        <h1 class="permanent-text">Flat <span class="highlight">50%</span> Offer</h1>
        <div class="right"></div>
        <div class="left"></div>
    </div>
</body>

</html>
