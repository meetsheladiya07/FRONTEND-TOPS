<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task</title>
    <style>
        .data {
            height: 300px;
            width: 490px;
            border: 2px solid;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;

        }

        .main {
            height: 300px;
            width: 500px;
            border: 2px solid;
            background: url("https://demo.w3layouts.com/demos_new/template_demo/20-06-2017/elite_shoppy-demo_Free/1660570665/web/images/bottom1.jpg");
            background-size: 100% 100%;
            background-repeat: no-repeat;
            transform: translateX(-14px);
            transition: .3s;
        }

        .main h2 {

            color: white;
            font-size: 20px;
            font-weight: 300;
            text-align: right;
            line-height: 100px;
        }

        .main h2 span {
            color: Red;
            font-weight: 700px;
        }

        .border {
            height: 200px;
            width: 400px;
            border: 5px solid white;
            margin: 50px auto;
            font-size: 20px;
            color: white;
            font-weight: 300;
            text-align: center;
            letter-spacing: 10px;
            line-height: 250px;
            transform: translateX(-14px);
            transition: .3s;
            opacity: 0;
        }

        .main:hover {
            transform: translateX(0px);
        }

        .main:hover .border {
            transform: translateX(0px);
            opacity: 1;
        }

        .content {
            height: 50px;
            width: 450px;
            position: fixed;
            text-align: right;
            z-index: 1;
            line-height: 200px;
        }

        .content h2 {
            font-size: 25px;
            letter-spacing: 10px;
            font-weight: 100;
            color: #fff;

            opacity: 1;
        }

        .content h2 span {
            color: #ff2d2d;
            font-weight: bold;      
        }
    </style>
</head>

<body>
    <div class="data">
        <div class="content">
            <h2><span>F</span>ALL AHEAD</h2>
        </div>
        <div class="main">


            <div class="border">
                New Arrivals
            </div>
        </div>
    </div>
</body>

</html>
