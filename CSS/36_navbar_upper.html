<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        ul{
            list-style: none;
        }
        ul li{
            display: inline-block;
            background-color: black;
            padding: 10px 20px;
            position: relative;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            
        }
        ul li a{
            text-decoration: none;
            color: white;
        }
        li::after{
            content: "";
            height: 5px;
            width: 0%;
            background: rgb(6, 230, 200);
            position: absolute;
            top: 0;
            right: 0;
            transition: .8s;
        }
        li:hover::after{
             width: 100%;
             
        }

    </style>
</head>
<body>
    <ul>
        <li><a href="">Home</a></li>
        <li><a href="">About</a></li>
        <li><a href="">Men's wear</a></li>
        <li><a href="">Woman's wear</a></li>
        <li><a href="">Short Codes</a></li>
        <li><a href="">Contact</a></li>
    </ul>
</body>
</html>
