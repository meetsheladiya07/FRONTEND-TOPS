<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table align="center" width="25%">
        <form action="">
            <caption>
                <h1>Admission Form</h1>
            </caption>
            <caption>Enter your admission information below</caption>
            <tr>
                <td colspan="4">
                    <hr>
                </td>
            </tr>
            <tr>
                <td><label for=""><b>Name *</b></label></td>

            </tr>
            <tr>
                <td><input type="text" required></td>
                <td><input type="text" required></td>
                <td><input type="text" required></td><br>
            </tr>

            <tr>
                <td><label for="">First Name</label></td>
                <td><label>Middle Name</label></td>
                <td><label>Last Name</label></td>
            </tr>

            <tr>
                <td colspan="3">&nbsp;</td>
            </tr>

            <tr>
                <td><label for=""><b>Birth Date*</b></label></td>
            </tr>

            <tr>
                <td><input type="date" required></td>
            </tr>

            <tr>
                <td colspan="3">&nbsp;</td>
            </tr>

            <tr>
                <td><label for=""><b>Gender*</b></label></td>
            </tr>

            <tr>
                <td><input type="radio" name="gender" required> Male</td>
            </tr>

            <tr>
                <td><input type="radio" name="gender" required> Female</td>
            </tr>

            <tr>
                <td><input type="radio" name="gender" required> Other</td>
            </tr>

            <tr>
                <td colspan="3">&nbsp;</td>
            </tr>

            <tr>
                <td colspan="2"><label for=""><b>Are you Hispanic or Latino?</b></label></td>
            </tr>

            <tr>
                <td><input type="radio" name="hispanic" required> No</td>
            </tr>

            <tr>
                <td><input type="radio" name="hispanic" required> Yes</td>
            </tr>

            <tr>
                <td><input type="radio" name="hispanic" required> Decline to Answer</td>

            </tr>

        </form>
    </table>
</body>

</html>
