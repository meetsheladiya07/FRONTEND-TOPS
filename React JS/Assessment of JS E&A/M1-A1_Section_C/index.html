<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Delivery Menu App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🍴 Food Delivery Menu</h1>

        <div class="restaurant-section">
            <h3>Restaurants</h3>

            <p id="loading">Loading restaurants...</p>
            <p id="error"></p>

            <select id="restaurantSelect">
                <option value="">Select Restaurant</option>
            </select>
        </div>
    </header>


    <nav>
        <button id="menuBtn">Browse Menu</button>

        <button id="cartBtn">
            View Cart (<span id="cartCount">0</span>)
        </button>

        <button id="clearCartBtn">Clear Cart</button>
    </nav>


    <section id="menuSection">

        <h2>🍕 Browse Menu</h2>

        <div id="menuContainer" class="menu-container">
        </div>

    </section>


    <section id="cartSection">

        <h2>🛒 Your Cart</h2>

        <div id="cartContainer">
        </div>

        <h3 id="totalPrice">Total: ₹0</h3>

    </section>


    <script src="script.js"></script>

</body>
</html>
