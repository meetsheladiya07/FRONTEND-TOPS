<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracker with Persistence</title>

    <style>
        .restaurant-item {
            cursor: pointer;
            margin: 10px 0;
            padding: 8px;
            width: 250px;
            border: 1px solid #ccc;
        }

        .favourite {
            font-weight: bold;
            background-color: lightgreen;
        }

        #errorMessage {
            color: red;
        }
    </style>
</head>

<body>

    <h1>Restaurant Order Tracker</h1>

    <p id="loadingMessage">Loading restaurants...</p>

    <p id="errorMessage"></p>

    <ul id="restaurantList"></ul>

    <p id="favouriteMessage"></p>


    <script>

        const restaurantList = document.getElementById("restaurantList");
        const loadingMessage = document.getElementById("loadingMessage");
        const errorMessage = document.getElementById("errorMessage");
        const favouriteMessage = document.getElementById("favouriteMessage");

        async function fetchRestaurants() {

            try {
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/users"
                );

                if (!response.ok) {
                    throw new Error("Failed to fetch restaurants.");
                }

                const restaurants = await response.json();

                loadingMessage.style.display = "none";

                const savedFavourite = localStorage.getItem("favouriteRestaurant");

                restaurants.forEach(function(restaurant) {

                    const listItem = document.createElement("li");

                    listItem.textContent = restaurant.name;

                    listItem.classList.add("restaurant-item");

                    if (restaurant.name === savedFavourite) {
                        listItem.classList.add("favourite");

                        favouriteMessage.textContent =
                            `Favourite Restaurant: ${restaurant.name}`;
                    }

                    listItem.addEventListener("click", function() {

                        const allItems =
                            document.querySelectorAll(".restaurant-item");

                        allItems.forEach(function(item) {
                            item.classList.remove("favourite");
                        });

                        listItem.classList.add("favourite");

                        localStorage.setItem(
                            "favouriteRestaurant",
                            restaurant.name
                        );

                        favouriteMessage.textContent =
                            `Favourite Restaurant: ${restaurant.name}`;
                    });

                    restaurantList.appendChild(listItem);
                });

            } catch (error) {

                loadingMessage.style.display = "none";

                errorMessage.textContent =
                    "Error: Unable to load restaurants. Please try again.";

                console.error(error);
            }
        }

        fetchRestaurants();

    </script>

</body>
</html>
