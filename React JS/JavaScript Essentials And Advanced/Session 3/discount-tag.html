<!DOCTYPE html>
<html>

<head>
    <title>Discount Tag</title>
</head>

<body>

    <h2>Product Discount</h2>

    <script>
        function showDiscountTag(price) {
            if (price < 500) {
                console.log("Special Discount!");
            } else {
                console.log("Regular Price");
            }
        }

        // Call the function
        showDiscountTag(450);
    </script>

</body>

</html>
