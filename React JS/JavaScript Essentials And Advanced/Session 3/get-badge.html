<!DOCTYPE html>
<html>
<head>
    <title>Get Badge</title>
</head>
<body>

    <h2>Instagram Badge</h2>

    <script>
        function getBadge(followers) {
            return followers >= 1000
                ? "Verified Creator ⭐"
                : "Regular User";
        }

        console.log(getBadge(1500));
        console.log(getBadge(500));
    </script>

</body>
</html>
