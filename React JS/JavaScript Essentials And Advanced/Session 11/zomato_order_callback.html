    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Order Status</title>
</head>
<body>

    <script>
        function placeOrder(item, callback) {
            setTimeout(function() {
                callback("Your " + item + " is being prepared");
            }, 1000);
        }

        placeOrder("Pizza", function(message) {
            console.log(message);
        });
    </script>

</body>
</html>
