<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Status Promise</title>
</head>

<body>

    <h2>Order Status</h2>

    <script>

        function getOrderStatus(orderId) {

            return new Promise((res, rej) => {

                setTimeout(() => {

                    if (orderId % 2 === 0) {

                        res("Order delivered")

                    } else {

                        rej("Order not found")

                    }

                }, 1500)
            })
                .then((result) => {
                    console.log(result)
                })

                .catch((error) => {
                    console.log(error)
                })
        }

        getOrderStatus(1025)

    </script>

</body>

</html>
