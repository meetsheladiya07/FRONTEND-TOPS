<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Destructuring</title>
</head>

<body>

    <h1>Movie Details</h1>

    <script>
        // Create a movie object
        const movie = {
            title: "Jawan",
            rating: 4.5,
            genre: "Action"
        };

        // Use object destructuring
        const { title, rating } = movie;

        // Display the movie title and rating
        console.log(`Movie: ${title}, Rating: ${rating}`);
    </script>

</body>
</html>
