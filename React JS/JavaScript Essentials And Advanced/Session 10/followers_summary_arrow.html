<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Followers Summary</title>
</head>

<body>

    <h1>Followers Summary</h1>

    <script>
        const getFollowersSummary = (...followers) => {
            let total = 0;

            for (let i = 0; i < followers.length; i++) {
                total += followers[i];
            }

            return `Total followers: ${total}`;
        };

        const result = getFollowersSummary(400, 350, 450);

        console.log(result);
    </script>

</body>
</html>
