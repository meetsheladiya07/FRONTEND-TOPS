<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add To Cart Arrow Function</title>
</head>

<body>

    <h1>Add To Cart</h1>

    <script>
        const addToCartArrow = (...prices) => {
            let total = 0;

            for (let i = 0; i < prices.length; i++) {
                total += prices[i];
            }

            return total;
        };

        const total = addToCartArrow(500, 250, 100, 150);

        console.log("Total Cart Price: ₹" + total);
    </script>

</body>
</html>
