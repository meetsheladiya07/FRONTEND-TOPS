<!DOCTYPE html>
<html>
<head>
    <title>Flipkart Wishlist</title>

    <style>
        .wishlist {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .product {
            width: 200px;
            padding: 15px;
            border: 1px solid #ccc;
            text-align: center;
            border-radius: 8px;
        }

        .product img {
            width: 150px;
            height: 150px;
            object-fit: cover;
        }

        button {
            padding: 8px 15px;
            margin-top: 10px;
            cursor: pointer;
        }

        .add-btn {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <h2>My Wishlist</h2>

    <button class="add-btn" id="addProduct">Add Product</button>

    <!-- Parent container -->
    <div class="wishlist" id="wishlist">

        <!-- Existing Product 1 -->
        <div class="product">
            <img src="https://cdn.pixabay.com/photo/2020/12/14/09/46/smartphone-5830473_1280.png" alt="Product">
            <h3>Smartphone</h3>
            <p>₹15,999</p>
            <button class="removeBtn">Remove</button>
        </div>

        <!-- Existing Product 2 -->
        <div class="product">
            <img src="https://cdn.pixabay.com/photo/2016/01/09/07/44/headphone-1129896_1280.png" alt="Product">
            <h3>Headphones</h3>
            <p>₹1,999</p>
            <button class="removeBtn">Remove</button>
        </div>

    </div>

    <script>

        const wishlist = document.getElementById("wishlist");

        const addProduct = document.getElementById("addProduct");

        let productNumber = 3;

        wishlist.addEventListener("click", function(event) {

            if (event.target.classList.contains("removeBtn")) {

                event.target.parentElement.remove();
            }
        });


        addProduct.addEventListener("click", function() {

            const product = document.createElement("div");

            product.classList.add("product");

            product.innerHTML = `
                <img src="https://cdn.pixabay.com/photo/2013/07/12/19/04/basket-154317_1280.png" alt="Product">

                <h3>New Product ${productNumber}</h3>

                <p>₹2,999</p>

                <button class="removeBtn">Remove</button>
            `;

            wishlist.appendChild(product);

            productNumber++;
        });

    </script>

</body>
</html>
