<!DOCTYPE html>
<html>
<head>
    <title>Instagram Story Removal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        .stories {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .story-card {
            width: 150px;
            background-color: white;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .story-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }

        .remove-btn {
            margin-top: 10px;
            padding: 6px 12px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>Instagram Stories</h2>

    <!-- Parent container -->
    <div class="stories" id="stories">

        <div class="story-card">
            <img src="https://cdn.pixabay.com/photo/2023/10/09/16/54/childrens-book-8304585_1280.jpg" alt="Story">
            <h3>Meet</h3>
            <button class="remove-btn">Remove</button>
        </div>

        <div class="story-card">
            <img src="https://cdn.pixabay.com/photo/2023/10/09/16/54/childrens-book-8304585_1280.jpg" alt="Story">
            <h3>Rahul</h3>
            <button class="remove-btn">Remove</button>
        </div>

        <div class="story-card">
            <img src="https://cdn.pixabay.com/photo/2023/10/09/16/54/childrens-book-8304585_1280.jpg" alt="Story">
            <h3>Priya</h3>
            <button class="remove-btn">Remove</button>
        </div>

        <div class="story-card">
            <img src="https://cdn.pixabay.com/photo/2023/10/09/16/54/childrens-book-8304585_1280.jpg" alt="Story">
            <h3>Jay</h3>
            <button class="remove-btn">Remove</button>
        </div>

    </div>

    <script>

        const stories = document.getElementById("stories");

        stories.addEventListener("click", function(event) {

            if (event.target.classList.contains("remove-btn")) {

                const storyCard = event.target.parentElement;

                storyCard.remove();
            }

        });

    </script>

</body>
</html>
