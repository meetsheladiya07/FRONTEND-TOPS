<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Cart Remove</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f3f6;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        .add-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            cursor: pointer;
        }

        .cart {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .product-card {
            width: 200px;
            background-color: white;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .product-card img {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        .remove-btn {
            position: absolute;
            top: 5px;
            right: 8px;
            border: none;
            background: none;
            font-size: 20px;
            cursor: pointer;
        }

        .price {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>My Shopping Cart</h2>

    <button class="add-btn" id="addProduct">
        Add Random Product
    </button>

    <!-- Parent Cart Container -->
    <div class="cart" id="cart">

        <!-- Existing Product -->
        <div class="product-card">
            <button class="remove-btn">✕</button>

            <img src="https://cdn.pixabay.com/photo/2020/12/14/09/46/smartphone-5830473_1280.png" alt="Mobile">

            <h3>Smartphone</h3>

            <p class="price">₹15,999</p>
        </div>

        <!-- Existing Product -->
        <div class="product-card">
            <button class="remove-btn">✕</button>

            <img src="https://cdn.pixabay.com/photo/2016/01/09/07/44/headphone-1129896_1280.png" alt="Headphones">

            <h3>Headphones</h3>

            <p class="price">₹1,999</p>
        </div>

    </div>


    <script>

        const cart = document.getElementById("cart");

        const addProduct = document.getElementById("addProduct");

        let productNumber = 1;


        cart.addEventListener("click", function(event) {

            if (event.target.classList.contains("remove-btn")) {

                const productCard = event.target.parentElement;

                productCard.remove();
            }

        });


        addProduct.addEventListener("click", function() {

            const productCard = document.createElement("div");

            productCard.classList.add("product-card");

            productCard.innerHTML = `
                <button class="remove-btn">✕</button>

                <img src="https://cdn.pixabay.com/photo/2025/10/21/17/10/smartwatch-9907990_1280.jpg" alt="Product">

                <h3>Random Product ${productNumber}</h3>

                <p class="price">₹${999 + productNumber * 500}</p>
            `;

            cart.appendChild(productCard);

            productNumber++;

        });

    </script>

</body>
</html>
