<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Refactor code</title>
</head>

<body>
    <script>
        class Movie {
            constructor(title, genre) {
                this.title = title;
                this.genre = genre;
            }

            display() {
                console.log(this.title + ' - ' + this.genre);
            }
        }

        const movie1 = new Movie("Inception", "Sci-Fi");
        const movie2 = new Movie("The Dark Knight", "Action");

        movie1.display();
        movie2.display();

    </script>
</body>

</html>
