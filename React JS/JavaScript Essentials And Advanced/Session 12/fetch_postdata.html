<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch User Post Data</title>
</head>
<body>
    <script>

      fetch("https://jsonplaceholder.typicode.com/posts",{
        method:"GET"
      })
      .then((res)=>{
        return res.json()
      })
      .then((test)=>{
         console.log(test)
        test.forEach((data)=>{
            console.log(`Title: ${data.title} \n`)
        })

      })

    </script>
</body>
</html>
