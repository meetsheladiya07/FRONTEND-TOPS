<!DOCTYPE html>
<html>
<head>
    <title>Filter Albums</title>
</head>
<body>

    <h2>Albums of User 2</h2>

    <script>

        fetch("https://jsonplaceholder.typicode.com/albums", {
            method: "GET"
        })

            .then(res => res.json())

            .then(albums => {

                let filteredAlbums = albums.filter(album => album.userId === 2);

                filteredAlbums.forEach(album => {
                    console.log(album.title);
                });

            })

            .catch(error => {
                console.log("Error:", error);
            });

    </script>

</body>
</html>
