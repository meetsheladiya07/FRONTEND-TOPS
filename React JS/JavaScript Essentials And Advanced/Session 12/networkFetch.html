<!DOCTYPE html>
<html>
<head>
    <title>Network Fetch</title>
</head>
<body>

    <h2>Fetch Users - Network Request</h2>

    <script>

        fetch("https://jsonplaceholder.typicode.com/users", {
            method: "GET"
        })

            .then(res => res.json())

            .then(users => {
                console.log("Users:", users);
            })

            .catch(error => {
                console.log("Error:", error);
            });

    </script>
    <img src="networkFetch.png" alt="">
</body>
</html>
