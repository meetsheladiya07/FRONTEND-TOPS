<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Order Form</title>
</head>
<body>

    <h2>Food Order Form</h2>

    <label for="cuisine">Select Cuisine:</label>
    <select id="cuisine" onchange="showCuisine()">
        <option value="">-- Select Cuisine --</option>
        <option value="Indian">Indian</option>
        <option value="Chinese">Chinese</option>
        <option value="Italian">Italian</option>
    </select>

    <br><br>

    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" min="1" placeholder="Enter quantity">

    <p id="message"></p>

    <script>
        function showCuisine() {
            // Get the selected cuisine
            let cuisine = document.getElementById("cuisine").value;

            // Display the selected cuisine
            document.getElementById("message").innerHTML =
                "You selected " + cuisine + " cuisine!";
        }
    </script>

</body>
</html>
