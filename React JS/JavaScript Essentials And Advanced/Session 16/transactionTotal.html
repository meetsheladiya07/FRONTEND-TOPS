<!DOCTYPE html>
<html>

<head>
    <title>Total Transaction Amount</title>
</head>

<body>

    <h2>Total Amount Spent</h2>

    <script>

        let transactions = [
            {
                name: "Grocery",
                amount: 500
            },
            {
                name: "Shopping",
                amount: 1200
            },
            {
                name: "Food",
                amount: 350
            },
            {
                name: "Travel",
                amount: 800
            }
        ];

        let totalAmount = transactions.map(transaction => transaction.amount)
            .reduce((total, amount) => total + amount, 0);

        console.log("Total Amount Spent: ₹" + totalAmount);

    </script>

</body>

</html>
