<!DOCTYPE html>
<html>
<head>
    <title>Instagram Like Counts</title>
</head>
<body>

    <h2>Instagram Like Counts</h2>

    <script>

        let posts = [
            {
                username: "meet",
                likes: 120
            },
            {
                username: "rahul",
                likes: 250
            },
            {
                username: "jay",
                likes: 180
            },
            {
                username: "rohit",
                likes: 320
            }
        ];

        let likeCounts = posts.map(post => post.likes);

        console.log("Instagram Like Counts:");
        console.log(likeCounts);

    </script>

</body>
</html>
