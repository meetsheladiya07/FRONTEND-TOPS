<!DOCTYPE html>
<html>
<head>
    <title>Add To Cart</title>
</head>
<body>

    <h2>Add Product to Cart</h2>

    <button onclick="addToCart('Pizza', 2)">
        Add Pizza
    </button>

    <button onclick="addToCart('Burger', 0)">
        Add Burger
    </button>

    <button onclick="addToCart('Sandwich', -1)">
        Add Sandwich
    </button>


    <script>

        function addToCart(productName, quantity) {

            if (quantity < 0) {

                console.error(
                    "Error: Quantity cannot be negative."
                );

            }

            else if (quantity === 0) {

                console.warn(
                    "Warning: Quantity is zero."
                );

            }

            else {

                console.log(
                    "Success: " + productName +
                    " added to cart. Quantity: " + quantity
                );

            }
        }

        addToCart("Pizza", 2);
        addToCart("Burger", 0);
        addToCart("Sandwich", -1);

    </script>

</body>
</html>
