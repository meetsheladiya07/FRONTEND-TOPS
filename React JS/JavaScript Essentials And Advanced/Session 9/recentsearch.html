<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recent Searches</title>
</head>

<body>

    <h2>Recent Searches</h2>

    <script>

        let recent = [];

        function saveRecentSearch(query) {

            recent.push(query);

            const search = JSON.stringify(recent);

            localStorage.setItem("recent", search);

            console.log(search);
        }

        saveRecentSearch("Burger");
        saveRecentSearch("Sneakers");
        saveRecentSearch("Pizza");

    </script>

</body>
</html>
