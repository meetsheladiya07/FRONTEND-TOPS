<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube Channels JSON</title>
</head>

<body>

    <h2>Favorite YouTube Channels</h2>

    <script>

        const jsonChannels = '["Apna College", "CodeWithHarry", "Veggie City"]';

        function Chname(json) {

            const channels = JSON.parse(json);

            return channels;
        }


        const channel = Chname(jsonChannels);


        console.log(channel);

    </script>

</body>
</html>
