<!DOCTYPE html>
<html>
<head>
    <title>Flipkart Total Price</title>
</head>
<body>

    <h2>Flipkart Total Price</h2>

    <script>
        const prices = [16000, 1499, 55000, 2999];

        let total = 0;

        for (const price of prices) {
            total += price;
        }

        console.log("Total Price: ₹" + total);
    </script>

</body>
</html>
