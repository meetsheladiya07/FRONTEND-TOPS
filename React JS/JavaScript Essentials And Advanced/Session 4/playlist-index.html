<!DOCTYPE html>
<html>

<head>
    <title>Playlist with Index</title>
</head>

<body>

    <h2>My Playlist</h2>

    <script>
        const playlist = [
            "Love Me Like You Do",
            "Illegal Hathiyar",
            "Aam Jahe Munde",
            "Namo Namo"
        ];

        let i = 0;

        do {
            console.log(i + ": " + playlist[i]);
            i++;
        } while (i < playlist.length);
    </script>

</body>

</html>
