<!DOCTYPE html>
<html>
<head>
    <title>Check Payment Amount</title>
</head>
<body>

    <h2>Payment Amount Validation</h2>
    <script>

        function checkPaymentAmount(amount) {

            if (amount <= 0) {
                throw new Error("Amount must be positive");
            }

            return "Payment accepted";
        }

        try {
            let result = checkPaymentAmount(500);
            console.log(result);
        }
        catch (error) {
            console.log(error.message);
        }

    </script>

</body>
</html>
