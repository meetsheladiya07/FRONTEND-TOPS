<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Arrow Function</title>
</head>
<body>

    <script>
        // Arrow Function
        const double = (x) => x * 2;

        // Example
        console.log(double(5)); // Output: 10
    </script>

</body>
