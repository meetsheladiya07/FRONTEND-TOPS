<!DOCTYPE html>
<html>
<head>
    <title>BookMyShow Theme</title>

    <style>

        body{
            font-family:Arial, sans-serif;
            background:white;
            color:black;
            text-align:center;
            transition:0.4s;
        }

        .movie-card{
            width:350px;
            margin:auto;
            padding:20px;
            border:1px solid gray;
            border-radius:10px;
        }

        button{
            padding:10px 20px;
            margin-top:20px;
            cursor:pointer;
        }

        .dark-mode{
            background:#1b1b1b;
            color:white;
        }

        .dark-mode .movie-card{
            background:#2d2d2d;
            border:1px solid white;
        }

    </style>
</head>

<body>

<h1>BookMyShow</h1>

<div class="movie-card">
    <h2>Avengers: Endgame</h2>

    <p>&#11088; Rating: 9.5/10</p>

    <p>Action | Adventure | Sci-Fi</p>
</div>

<button onclick="toggleTheme()">
    Toggle Light/Dark Mode
</button>

<script>

function toggleTheme(){
    document.body.classList.toggle("dark-mode");
}

</script>

</body>
</html>
