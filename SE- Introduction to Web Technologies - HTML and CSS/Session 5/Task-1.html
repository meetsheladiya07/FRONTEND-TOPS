<!DOCTYPE html>
<html>
<head>
    <!--Create an HTML file for a Flipkart-style product card and apply inline CSS to set a unique background color and font size for the product title only.-->
    <title>Flipkart Product Card</title>
</head>
<body style="display:flex; justify-content:center; align-items:center;">

<div style="width:400px; border:1px solid gray; padding:15px; text-align:center;">
    <img src="/images/img1.jpg" alt="Product" style="width:100%; height:auto; margin-bottom:15px;">

    <!-- Inline CSS only for title -->
    <h2 style="background-color:#fff3cd; font-size:28px;">
        Samsung Galaxy Z Fold8
    </h2>

    <p><b>Color:</b> Lavender</p>

    <p><b>Variant:</b> 512GB + 12GB</p>

    <p><b>Price:</b> ₹1,99,999</p>

    <button>Buy Now</button>
</div>

</body>
</html>
