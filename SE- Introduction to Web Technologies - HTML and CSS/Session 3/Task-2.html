<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Food Order Form</title>
</head>
<body>
     <!-- ========================================= -->
    <!-- Task 4 & 5 : Zomato Food Order Form -->
    <!-- ========================================= -->

    <h2>Zomato Food Order Form</h2>

    <form action="#" method="POST">

        <label for="orderid">Order ID:</label><br>
        <input
            type="text"
            id="orderid"
            value="ORD12345"
            disabled>

        <br><br>

        <label for="customer">User Name:</label><br>
        <input
            type="text"
            id="customer"
            name="customer"
            placeholder="Enter your name"
            required>

        <br><br>

        <label for="food">Food Item:</label><br>
        <select id="food" name="food" required>

            <option value="" selected disabled>Select Food</option>
            <option value="Pizza">Pizza</option>
            <option value="Burger">Burger</option>
            <option value="Biryani">Biryani</option>
            <option value="Pasta">Pasta</option>

        </select>

        <br><br>

        <label for="qty">Quantity:</label><br>
        <input
            type="number"
            id="qty"
            name="quantity"
            min="1"
            max="20"
            required>

        <br><br>

        <label for="instruction">Delivery Instructions:</label><br>
        <textarea
            id="instruction"
            name="instruction"
            rows="4"
            cols="40"
            placeholder="Enter delivery instructions..."
            required></textarea>

        <br><br>

        <input type="submit" value="Place Order">
    </form>
</body>
</html>
