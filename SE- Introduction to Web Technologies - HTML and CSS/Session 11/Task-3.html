<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">
        Restaurants Near You
    </h2>

    <div class="row g-4">

        <!-- Restaurant 1 -->
        <div class="col-md-6">

            <div class="card shadow h-100">

                <div class="card-body">

                    <h4 class="fw-bold">
                        La Pino's Pizza
                    </h4>

                    <p class="text-muted">
                        Pizza, Italian, Fast Food
                    </p>

                    <!-- Rating -->
                    <span class="bg-success text-white px-2 py-1 rounded">
                        &#11088; 4.5
                    </span>

                    <!-- Offer -->
                    <span class="bg-warning text-dark px-2 py-1 rounded">
                        50% OFF
                    </span>

                    <!-- Status -->
                    <span class="bg-primary text-white px-2 py-1 rounded">
                        Open
                    </span>

                </div>

            </div>

        </div>

        <!-- Restaurant 2 -->
        <div class="col-md-6">

            <div class="card shadow h-100">

                <div class="card-body">

                    <h4 class="fw-bold">
                        Honest Restaurant
                    </h4>

                    <p class="text-muted">
                        Gujarati, Punjabi, Fast Food
                    </p>

                    <!-- Rating -->
                    <span class="bg-success text-white px-2 py-1 rounded">
                        &#11088; 4.2
                    </span>

                    <!-- Offer -->
                    <span class="bg-danger text-white px-2 py-1 rounded">
                        20% OFF
                    </span>

                    <!-- Status -->
                    <span class="bg-secondary text-white px-2 py-1 rounded">
                        Closed
                    </span>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
