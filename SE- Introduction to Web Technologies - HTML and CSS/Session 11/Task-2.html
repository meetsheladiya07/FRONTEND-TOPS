<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Review</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow mx-auto" style="max-width: 600px;">

        <div class="card-body">

            <!-- Movie Title -->
            <h1 class="fw-bold fs-2">
                Avengers: Endgame
            </h1>

            <!-- Genre -->
            <p class="text-muted fst-italic">
                Action | Adventure | Sci-Fi
            </p>

            <!-- Rating -->
            <h3 class="fw-bold fs-4 text-success">
                &#11088; 4.8 / 5
            </h3>

            <!-- Review -->
            <p class="fw-normal fs-5">
                An exciting and emotional superhero movie with
                excellent action sequences and a memorable ending.
            </p>

            <!-- Reviewer -->
            <p class="fw-light small">
                Reviewed by Meet
            </p>

        </div>

    </div>

</div>

</body>
</html>
