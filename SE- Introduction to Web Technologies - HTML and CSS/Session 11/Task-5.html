<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Theme Switcher</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- Main Container -->
<div id="mainContainer"
     class="container-fluid bg-light text-dark min-vh-100 p-5">

    <div class="text-center">

        <h1 class="mb-4">
            Movie Booking
        </h1>

        <div class="card mx-auto p-4 mb-4"
             style="max-width: 500px;">

            <h2>
                Avengers: Endgame
            </h2>

            <p>
                Action | Adventure | Sci-Fi
            </p>

            <h4>
                &#11088; 4.8 / 5
            </h4>

            <button class="btn btn-danger mt-3">
                Book Ticket
            </button>

        </div>

        <!-- Theme Switcher -->
        <button id="themeButton"
                class="btn btn-dark">
            Dark Mode
        </button>

    </div>

</div>

<script>

    const mainContainer = document.getElementById("mainContainer");
    const themeButton = document.getElementById("themeButton");

    themeButton.addEventListener("click", function () {

        // Toggle background
        mainContainer.classList.toggle("bg-light");
        mainContainer.classList.toggle("bg-dark");

        // Toggle text color
        mainContainer.classList.toggle("text-dark");
        mainContainer.classList.toggle("text-light");

        // Change button text
        if (mainContainer.classList.contains("bg-dark")) {
            themeButton.textContent = "Light Mode";
            themeButton.classList.remove("btn-dark");
            themeButton.classList.add("btn-light");
        } else {
            themeButton.textContent = "Dark Mode";
            themeButton.classList.remove("btn-light");
            themeButton.classList.add("btn-dark");
        }

    });

</script>

</body>
</html>
