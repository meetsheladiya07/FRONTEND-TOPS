<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Spacing</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Flipkart Product</h2>

    <!--
        m-3  = margin level 1
        m-4  = margin level 2
        m-5  = margin level 3

        p-2  = padding level 1
        p-4  = padding level 2
        p-5  = padding level 3
    -->

    <div class="card m-5 p-4 mx-auto" style="max-width: 400px;">

        <img src="images/img2.png"
             class="card-img-top p-2"
             alt="Product">

        <div class="card-body">

            <h4 class="card-title m-3">
                Samsung Galaxy Smartphone
            </h4>

            <p class="card-text p-2">
                Powerful smartphone with a high-quality camera
                and long-lasting battery.
            </p>

            <h5 class="text-success m-4">
                ₹1,29,999
            </h5>

        </div>

    </div>

</div>

</body>
</html>
