<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Links & Gamer Bio</title>

    <!-- Only your own CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Gamer Bio -->
        <section class="gamer-profile">

            <div class="avatar">
                &#127918;
            </div>

            <h1>ShadowX</h1>
            <p>Gamer | Streamer | Content Creator</p>

            <div class="gaming-links">

                <a href="https://www.twitch.tv/" target="_blank" class="twitch">
                    &#128249; Twitch
                </a>

                <a href="https://discord.com/" target="_blank" class="discord">
                    &#128488; Discord
                </a>

                <a href="https://store.steampowered.com/" target="_blank" class="steam">
                    &#127918; Steam
                </a>

            </div>

        </section>


        <!-- Music Links Form -->
        <section class="form-section">

            <h2>Add Your Music Links</h2>

            <form id="musicLinksForm">

                <div class="input-box">
                    <span class="icon spotify-icon">&#127925;</span>

                    <input
                        type="url"
                        placeholder="Enter your Spotify profile URL"
                    >
                </div>


                <div class="input-box">
                    <span class="icon youtube-icon">&#9654;</span>

                    <input
                        type="url"
                        placeholder="Enter your YouTube Music profile URL"
                    >
                </div>


                <div class="input-box">
                    <span class="icon apple-icon">&#127822;</span>

                    <input
                        type="url"
                        placeholder="Enter your Apple Music profile URL"
                    >
                </div>


                <button type="submit">
                    Add Music Links
                </button>

            </form>

        </section>


        <!-- Preview Cards -->
        <section class="preview-section">

            <h2>Music Link Preview</h2>

            <div class="preview-container">

                <!-- Spotify -->
                <div class="preview-card spotify-card">

                    <div class="card-logo">&#127925;</div>

                    <h3>Spotify</h3>
                    <p>@yourspotifyprofile</p>

                    <a href="https://open.spotify.com/" target="_blank">
                        Visit
                    </a>

                </div>


                <!-- YouTube Music -->
                <div class="preview-card youtube-card">

                    <div class="card-logo">&#9654;</div>

                    <h3>YouTube Music</h3>
                    <p>@yourchannel</p>

                    <a href="https://music.youtube.com/" target="_blank">
                        Visit
                    </a>

                </div>


                <!-- Apple Music -->
                <div class="preview-card apple-card">

                    <div class="card-logo">&#127822;</div>

                    <h3>Apple Music</h3>
                    <p>@yourapplemusic</p>

                    <a href="https://music.apple.com/" target="_blank">
                        Visit
                    </a>

                </div>

            </div>

        </section>

    </div>

</body>
</html>
