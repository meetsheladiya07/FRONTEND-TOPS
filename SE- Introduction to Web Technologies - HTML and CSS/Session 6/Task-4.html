<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BookMyShow Posters</title>

<style>

body{
    font-family:Arial;
}

.grid{
    display:flex;
    gap:20px;
}

.poster{
    position:relative;
    width:180px;
}

.poster img{
    width:100%;
}

.badge{
    position:absolute;
    top:10px;
    left:10px;
    background:red;
    color:white;
    padding:5px 10px;
    border-radius:5px;
}

</style>

</head>

<body>

<div class="grid">

<div class="poster">

<span class="badge">New</span>

<img src="/Images/img2.png" alt="Movie" width="150px" height="250px">

</div>

<div class="poster">

<img src="/Images/img3.png" alt="Movie" width="150px" height="250px">

</div>

<div class="poster">

<img src="/Images/img4.jpg" alt="Movie" width="150px" height="250px">

</div>

</div>

</body>
</html>
