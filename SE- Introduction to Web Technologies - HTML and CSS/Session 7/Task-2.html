<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Playlist</title>

    <style>
        .playlist {
            display: flex;
            gap: 15px;
            padding: 20px;
            background-color: #222;
        }

        .song-card {
            width: 180px;
            height: 80px;
            padding: 10px;
            background-color: #333;
            color: white;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            border-radius: 10px;
        }

        .song-name {
            font-size: 18px;
            font-weight: bold;
        }

        .artist {
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <h1>My Playlist</h1>

    <div class="playlist">

        <div class="song-card">
            <div class="song-name">Aam Jahe Munde</div>
            <div class="artist">Parmish Verma</div>
        </div>

        <div class="song-card">
            <div class="song-name">Tum Hi Ho</div>
            <div class="artist">Arijit Singh</div>
        </div>

        <div class="song-card">
            <div class="song-name">Bairan</div>
            <div class="artist">Banjaare</div>
        </div>

        <div class="song-card">
            <div class="song-name">Sitaare (From "Ikkis")</div>
            <div class="artist">Amitabh Bhattacharya, Arijit Singh, Sachin-Jigar</div>
        </div>

        <div class="song-card">
            <div class="song-name">Vahal No Dariyo</div>
            <div class="artist">Santvani Trivedi</div>
        </div>

    </div>

</body>
</html>
