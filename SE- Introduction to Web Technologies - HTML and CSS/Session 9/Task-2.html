<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Restaurant Listing</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">Restaurants</h2>

    <div class="row g-4">

        <div class="col-6">
            <div class="card p-3 shadow-sm">
                <h4>La Pino's Pizza</h4>
                <p>Delicious pizzas, pasta and Italian food.</p>
                <span class="badge bg-success">4.5 ★</span>
            </div>
        </div>

        <div class="col-6">
            <div class="card p-3 shadow-sm">
                <h4>Domino's Pizza</h4>
                <p>Fresh pizzas, sides and refreshing beverages.</p>
                <span class="badge bg-success">4.3 ★</span>
            </div>
        </div>

        <div class="col-6">
            <div class="card p-3 shadow-sm">
                <h4>Honest Restaurant</h4>
                <p>Gujarati, Punjabi and fast food dishes.</p>
                <span class="badge bg-success">4.2 ★</span>
            </div>
        </div>

        <div class="col-6">
            <div class="card p-3 shadow-sm">
                <h4>McDonald's</h4>
                <p>Burgers, fries, beverages and quick bites.</p>
                <span class="badge bg-success">4.4 ★</span>
            </div>
        </div>

    </div>
</div>

</body>
</html>
