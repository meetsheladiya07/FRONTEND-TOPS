<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Cards</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">Flipkart Products</h2>

    <div class="row g-4">

        <div class="col-md-4">
            <div class="card h-100">
                <img src="images/img1.png" class="card-img-top" alt="Laptop">
                <div class="card-body">
                    <h5 class="card-title">Dell Laptop</h5>
                    <p class="card-text">Powerful laptop for work and entertainment.</p>
                    <h5>₹99,999</h5>
                    <button class="btn btn-primary">Buy Now</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100">
                <img src="images/img2.png" class="card-img-top" alt="Mobile">
                <div class="card-body">
                    <h5 class="card-title">Samsung Galaxy</h5>
                    <p class="card-text">Modern smartphone with excellent camera.</p>
                    <h5>₹1,29,999</h5>
                    <button class="btn btn-primary">Buy Now</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100">
                <img src="images/img3.png" class="card-img-top" alt="Headphones">
                <div class="card-body">
                    <h5 class="card-title">Wireless Headphones</h5>
                    <p class="card-text">Enjoy high-quality sound without wires.</p>
                    <h5>₹79,999</h5>
                    <button class="btn btn-primary">Buy Now</button>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
