<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <fieldset style="width: 25%;align-items: center; margin-left: 37.5%;">
        <legend><b>Customer</b></legend>

        <table align="center">
            <form>
                <tr>
                    <td><label for="">Name*</label></td>
                    <td><input type="text" pattern="[A-Za-z]{2,9}" required></td>
                </tr>

                <tr>
                    <td><label for="">Email*</label></td>
                    <td><input type="email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,3}$" required></td>
                </tr>

                <tr>
                    <td><label for="">Investment</label></td>
                    <td><input type="number" required></td>
                </tr>

                <tr>
                    <td><Label>Date Joined*</Label></td>
                    <td><input type="date" required></td>
                </tr>

                <tr>
                    <td><label for="">Active</label></td>
                    <td><input type="checkbox"></td>
                </tr>
                <tr>
                 <td><button type="submit">OK</button>
                 <button type="reset">Cancel</button></td>

                </tr>
            </form>
        </table>
    </fieldset>

</body>

</html>
