<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <table align="center">

            <tr>
                <td colspan="3">
                    <caption>
                        <h1>Membership Application</h1>
                    </caption>
                </td>
            </tr>

            <tr>
                <td colspan="3">
                    <caption>To apply for membership please complete all questions.</caption>
                </td>
            </tr>
            <tr>
                <td colspan="3">
                    <hr>
                </td>
            </tr>

            <tr>
                <td colspan="3">&nbsp;</td>
            </tr>
            <tr>
                <td>
                    <label><b>Name</b></label>
                </td>

                <td>
                    <input type="text" pattern="[A-Za-z]{2,9}" required>
                </td>

                <td>
                    <input type="text" pattern="[A-Za-z]{2,9}" required>
                </td>
            </tr>

            <tr>
                <td></td>
                <td>First Name</td>
                <td>Last Name</td>
            </tr>

            <tr>
                <td colspan="4">&nbsp;</td>
            </tr>

            <tr>
                <td><label><b>Address</b></label></td>
                <td colspan="2"><textarea name="address" id="address" cols="45" rows="1" required></textarea></td>
            </tr>

            <tr>
                <td></td>
                <td>Street Address</td>
            </tr>

            <tr><td colspan="4">&nbsp;</td></tr>

            <tr>
                <td></td>
                <td colspan="2"><textarea name="address" id="address" cols="45" rows="1" required></textarea></td>
            </tr>

            <tr>
                <td></td>
                <td>Street Address Line 2</td>
            </tr>

            <tr><td colspan="4">&nbsp;</td></tr>

            <tr>
                <td></td>
                <td><input type="text" pattern="[A-Za-z]{2,15}" required></td>
                <td><input type="text" pattern="[A-Za-z]{2,15}" required></td>
            </tr>

            <tr>
                <td></td>
                <td>City</td>
                <td>State/Province  </td>
            </tr>

            <tr><td colspan="4">&nbsp;</td></tr>

            <tr>
                <td></td>
                <td><input type="text" pattern="[A-Za-z]{2,15}" required></td>
                <td><select required>
                    <option value="">Please Select</option>
                    <option value="CA">California</option>
                    <option value="TX">Texas</option>
                    <option value="NY">New York</option>
                </select></td>
            </tr>

            <tr>
                <td></td>
                <td>Postal/Zip Code</td>
                <td>Country</td>
            </tr>

            <tr><td colspan="3">&nbsp;</td></tr>

            <tr>
                <td><label><b>E-mail</b></label></td>
                <td colspan="2"><input type="email" style="width: 300px;" pattern="[a-z0-9]+'@'+[a-z]+'.'+[a-z]{2,3}$" required></td>
            </tr>

            <tr><td colspan="3">&nbsp;</td></tr>

            <tr>
                <td><label><b>Home Number</b></label></td>
                <td><input type="tel" style="width: 50px;" pattern="[0-9]{2,3}" required></td>

                <td><input type="tel" style="width: 250px;" pattern="[0-9]{10}" maxlength="10" required></td>
            </tr>

            <tr>
                <td></td>
                <td><label>Area Code</label></td>
                <td><label>Phone Number</label></td>
            </tr>

            <tr><td colspan="3">&nbsp;</td></tr>

            <tr>
                <td><label><b>Cellular Number</b></label></td>
                <td><input type="tel" style="width: 50px;" pattern="[0-9]{2,3}" required></td>

                <td><input type="tel" style="width: 250px;" pattern="[0-9]{10}" maxlength="10" required></td>
            </tr>

            <tr>
                <td></td>
                <td><label>Area Code</label></td>
                <td><label>Phone Number</label></td>
            </tr>

            <tr><td colspan="3">&nbsp;</td></tr>

            <tr>
                <td><label><b>Work Number</b></label></td>
                <td><input type="tel" style="width: 50px;" pattern="[0-9]{2,3}" required></td>

                <td><input type="tel" style="width: 250px;" pattern="[0-9]{10}" maxlength="10" required></td>
            </tr>

            <tr>
                <td></td>
                <td><label>Area Code</label></td>
                <td><label>Phone Number</label></td>
            </tr>

            <tr><td colspan="3">&nbsp;</td></tr>

            <tr>
                <td><label><b>Website</b></label></td>
                <td colspan="2"><input type="url" style="width: 300px;" required></td>
            </tr>

        </table>
    </form>
</body>

</html>
