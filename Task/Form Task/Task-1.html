<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <div>
            <label for="">Firstname:</label>
            <input type="text" pattern="[A-Za-z]{2,9}" required>
        </div>
        <br>
        <div>
            <label>Middlename:</label>
            <input type="text" pattern="[A-Za-z]{2,11}" required>
        </div>
        <br>
        <div>
            <label>Lastname:</label>
            <input type="text" pattern="[A-Za-z]{2,9}" required>
        </div>

        <br>

        <div>
            <label>Courses:</label>
            <select name="" id="">
                <option value="">Select Course</option>
                <option value="">Course1</option>
                <option value="">Course2</option>
                <option value="">Course3</option>
            </select>
        </div>

        <br>

        <div>
            <label>Gender:</label> <br>
            <input type="radio" name="gender">Male <br>
            <input type="radio" name="gender">Female   <br>
            <input type="radio" name="gender">Other <br>
        </div>

        <br>

        <div>
            <label>Phone:</label>
            <input type="tel" pattern="[0-9]{10}" maxlength="10" required>
        </div>

        <br>

        <div>
            <label>Address:</label> <br>
            <textarea name="" id="" cols="200" rows="10"></textarea>

        </div>

        <br>

        <div>
            <lable>Email:</lable>
            <input type="email" pattern="[a-z0-9]+'@'+[a-z]+'.'+[a-z]{2,3}$" required>
        </div>

        <br>

        <div>
            <label>Password:</label>
            <input type="password0" pattern="[A-Z][A-Za-z0-9#%]{6,10}" required>
        </div>

        <br>
        <div>
            <label>Re-type Password:</label>
            <input type="password" pattern="[A-Z][A-Za-z0-9#%]{6,10}" required>
        </div>

        <br>
                <button type="submit">Submit</button>
    </form>
</body>
</html>
